<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - May's Handmade</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>May's Handmade</h1>
</header>

<nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="contact.html">Contact</a></li>
    </ul>
</nav>

<main>

    <section>
        <h2>Contact Us</h2>
        <p>Have questions or feedback? We'd love to hear from you!</p>

        <ul>
            <li>Phone: (+63) 960 810 0403</li>
            <li>Facebook: <a href="https://www.facebook.com/maymaymaymaymaymaymaymaymay23">May Bugtong</a></li>
            <li>Email: maybugtongbugtong@gmail.com</li>
        </ul>
    </section>

    <form>
        <fieldset>
            <legend>Your details</legend>

            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="subject">Subject</label>
            <select id="subject" name="subject">
                <option value="suggest-place">Suggest a place</option>
                <option value="correct-detail">Correct a detail</option>
                <option value="ask-question">Ask a question</option>
                <option value="something-else">Something else</option>
            </select>

            <label for="message">Message</label>
            <textarea id="message" name="message" placeholder="Your message here..."></textarea>

            <button type="submit">Send message</button>
        </fieldset>
    </form>

</main>

<footer>
    <p>&copy; 2026 May's Handmade</p>
</footer>

</body>
</html>
